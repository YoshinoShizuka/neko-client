// ===== 26.x 版本子工程（modern，不混淆）=====
//
// 26.3 / 26.2 / 26.1.2 / 26.1.1 四个版本的源码完全一致（javap 逐版本核对过：
// extract 渲染管线、对象化输入事件、EditBox、Screen.addRenderableWidget 全相同），
// 只有 gradle.properties 里的 minecraft_version / fabric_version 不同。
// 新落地一个 26.x = 复制相邻目录 + 改 gradle.properties + settings.gradle include 一行。

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
    mavenCentral()

    // malilib（masa 系客户端库：热键 + 配置界面）
    maven {
        name = 'masa'
        url = 'https://masa.dy.fi/maven/sakura-ryoko'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // 26.x 不混淆，所有依赖都用普通 implementation，不需要 modImplementation
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // malilib：热键（ConfigBooleanHotkeyed / ConfigHotkey）与配置界面（GuiConfigsBase）。
    // 🔴 26.x 不混淆、malilib 的 26.x 产物本来就是 Mojang 名 ⇒ 普通 implementation 即可。
    implementation("fi.dy.masa.malilib:${project.malilib_artifact}:${project.malilib_version}") {
        // conditional-mixin 已被 malilib 打进自己的 jar（META-INF/jars/），
        // maven 上那份坐标（me.fallenbreath:conditional-mixin-fabric:0.6.4）解析不到也不影响
        exclude group: 'me.fallenbreath', module: 'conditional-mixin-fabric'
    }

    // 共享纯逻辑（SearchIndex）：jar 打包时把它的 class 一并合并进来
    implementation project(':common')

    // 拼音匹配：jpinyin（Apache-2.0）。common 用 api 引它，这里只负责 JiJ 打包 +
    // 本子工程的运行时类路径
    implementation "com.github.stuxuhai:jpinyin:${project.jpinyin_version}"
    include "com.github.stuxuhai:jpinyin:${project.jpinyin_version}"

    // 纯逻辑单测（不启动游戏）：目前只覆盖 SearchConfig 的 JSON 读写两个纯函数。
    // 只挂在本子工程上 —— 五份源码仍逐字节相同，测试只在 26.3 跑一遍就够。
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

loom {
    runConfigs.configureEach {
        runDir 'run'
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from(project(':common').sourceSets.main.output)

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named('build') {
    doLast {
        def f = tasks.named('jar').get().archiveFile.get().asFile
        if (f.exists()) {
            println ''
            println '============================================================'
            println "  JAR : ${f.absolutePath}"
            println "  SIZE: ${f.length()} bytes"
            println '============================================================'
        } else {
            println "  [WARN] jar not found: ${f.absolutePath}"
        }
    }
}

// 产物统一复制到工作区 deliver/neko-voidwarehouse-search/（与服务端交付习惯对齐）
tasks.register('dist', Copy) {
    group = 'build'
    description = 'Copies the built mod jar into the workspace deliver/ directory'
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into rootProject.layout.projectDirectory.dir('../deliver/neko-voidwarehouse-search')
}
